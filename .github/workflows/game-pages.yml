name: Prepare and deploy game site

on:
  workflow_dispatch:

permissions:
  contents: none

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and test Pages artifact
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.12.1
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.16.1
          run_install: false

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: game/wiki-frontend

      - name: Build frontend
        run: pnpm build
        working-directory: game/wiki-frontend

      - name: Build static site
        run: python3 tools/build_site.py --react-dist wiki-frontend/dist
        working-directory: game

      - name: Test frontend against regenerated data
        run: pnpm test
        working-directory: game/wiki-frontend

      - name: Check production resource paths
        run: node --test checks/production-http.test.mjs
        working-directory: game/wiki-frontend
        env:
          PUG_INTEGRATED: "1"

      - name: Run standard-library tests
        run: python3 -m unittest discover -s tests -v
        working-directory: game
        env:
          SACRED_GOLD_CLEAN_ROM: ""
          SACRED_GOLD_XDELTA: ""

      - name: Record ROM-backed test scope
        run: echo "Positive ROM-backed VCDIFF integration is intentionally skipped; CI receives no clean ROM."

      - name: Check vendored VCDIFF JavaScript syntax
        run: node --check web/vendor/rompatcher/vcdiff.js
        working-directory: game

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: game/web/

  deploy:
    name: Deploy Pages artifact
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify public repository and default branch
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = urllib.parse.quote(os.environ["GITHUB_REPOSITORY"], safe="/")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  metadata = json.load(response)
          except (urllib.error.URLError, TimeoutError, json.JSONDecodeError) as error:
              print("::error::Could not verify repository visibility; Pages deployment stopped.", file=sys.stderr)
              raise SystemExit(1) from error

          if metadata.get("visibility") != "public":
              print("::error::Pages deployment is blocked: this repository must be public on GitHub Free. No deployment was attempted.", file=sys.stderr)
              raise SystemExit(1)

          default_branch = metadata.get("default_branch")
          if not default_branch or os.environ["GITHUB_REF"] != f"refs/heads/{default_branch}":
              print("::error::Pages deployment is limited to the current default branch. No deployment was attempted.", file=sys.stderr)
              raise SystemExit(1)

          print("Repository is public and this run targets its default branch.")
          PY

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
