name: Game CI

on:
  push:
    paths:
      - "game/**"
      - ".github/workflows/game-ci.yml"
      - ".github/workflows/game-pages.yml"
  pull_request:
    paths:
      - "game/**"
      - ".github/workflows/game-ci.yml"
      - ".github/workflows/game-pages.yml"

permissions:
  contents: none

jobs:
  validate:
    name: Build and test game project
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build static site
        run: python3 tools/build_site.py
        working-directory: game

      - name: Run standard-library tests
        run: python3 -m unittest discover -s tests -v
        working-directory: game
        env:
          SACRED_GOLD_CLEAN_ROM: ""
          SACRED_GOLD_XDELTA: ""

      - name: Record ROM-backed test scope
        run: echo "Positive ROM-backed VCDIFF integration is intentionally skipped; CI receives no clean ROM."

      - name: Check vendored VCDIFF JavaScript syntax
        run: node --check web/vendor/rompatcher/vcdiff.js
        working-directory: game

  wiki-frontend:
    name: Build and test React wiki
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate wiki data
        run: python3 tools/build_site.py
        working-directory: game

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.12.1
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.16.1
          run_install: false

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: game/wiki-frontend

      - name: Test frontend against generated data
        run: pnpm test
        working-directory: game/wiki-frontend

      - name: Build and check production paths
        run: pnpm check:production
        working-directory: game/wiki-frontend

      - name: Generate integrated site
        run: python3 tools/build_site.py --react-dist wiki-frontend/dist
        working-directory: game

      - name: Check integrated site paths
        run: node --test checks/production-http.test.mjs
        working-directory: game/wiki-frontend
        env:
          PUG_INTEGRATED: "1"
